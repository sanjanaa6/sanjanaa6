<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" role="img" aria-label="Sanjana's GitHub Trophies">
<title>Sanjana's Trophies</title>
<defs><style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
text{font-family:'Fira Code','Consolas','Liberation Mono',monospace}
@keyframes popUp{0%{opacity:0;transform:translateY(12px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tr{opacity:0;animation:popUp .5s ease forwards;transform-box:fill-box;transform-origin:center}
.flt{animation:floatY 4s ease-in-out infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#38bdf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#34d399;#38bdf8;#34d399" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<rect x="1" y="1" width="798" height="158" rx="14" fill="#0f172a" stroke="url(#tg)" stroke-width="1.5"/>

<!-- Trophy 1 -->
<g class="tr" style="animation-delay:0.3s" transform="translate(30,20)">
  <rect x="0" y="0" width="166" height="118" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g class="flt">
    <circle cx="83" cy="42" r="24" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="1"/>
    <text x="83" y="49" text-anchor="middle" font-size="24">🏆</text>
  </g>
  <text x="83" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#fbbf24">Repo Hunter</text>
  <text x="83" y="104" text-anchor="middle" font-size="10" fill="#94a3b8">20+ Repositories</text>
</g>

<!-- Trophy 2 -->
<g class="tr" style="animation-delay:0.5s" transform="translate(220,20)">
  <rect x="0" y="0" width="166" height="118" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g class="flt" style="animation-delay:1s">
    <circle cx="83" cy="42" r="24" fill="rgba(52,211,153,.12)" stroke="#34d399" stroke-width="1"/>
    <text x="83" y="49" text-anchor="middle" font-size="24">⚡</text>
  </g>
  <text x="83" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">Commit Master</text>
  <text x="83" y="104" text-anchor="middle" font-size="10" fill="#94a3b8">500+ Commits</text>
</g>

<!-- Trophy 3 -->
<g class="tr" style="animation-delay:0.7s" transform="translate(410,20)">
  <rect x="0" y="0" width="166" height="118" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g class="flt" style="animation-delay:2s">
    <circle cx="83" cy="42" r="24" fill="rgba(56,189,248,.12)" stroke="#38bdf8" stroke-width="1"/>
    <text x="83" y="49" text-anchor="middle" font-size="24">⭐</text>
  </g>
  <text x="83" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8">Star Gazer</text>
  <text x="83" y="104" text-anchor="middle" font-size="10" fill="#94a3b8">50+ Stars Earned</text>
</g>

<!-- Trophy 4 -->
<g class="tr" style="animation-delay:0.9s" transform="translate(600,20)">
  <rect x="0" y="0" width="166" height="118" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g class="flt" style="animation-delay:3s">
    <circle cx="83" cy="42" r="24" fill="rgba(96,165,250,.12)" stroke="#60a5fa" stroke-width="1"/>
    <text x="83" y="49" text-anchor="middle" font-size="24">🎓</text>
  </g>
  <text x="83" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#60a5fa">MCA Scholar</text>
  <text x="83" y="104" text-anchor="middle" font-size="10" fill="#94a3b8">AI &amp; Web Developer</text>
</g>
</svg>
