<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Top languages">
<title>Sanjana - Top Languages</title>
<defs><style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
text{font-family:'Fira Code','Consolas','Liberation Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#38bdf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#34d399;#38bdf8;#34d399" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
<clipPath id="stackc"><rect x="20" y="58" width="0" height="11" rx="5.5"><animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></clipPath>
</defs>
<rect x="1" y="1" width="418" height="280" rx="14" fill="#0f172a" stroke="url(#tg)" stroke-width="1.5"/>
<text x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)">📊 Top Languages</text>
<g clip-path="url(#stackc)">
  <rect x="20.0" y="58" width="171.0" height="11" fill="#38bdf8"/>
  <rect x="191.0" y="58" width="95.0" height="11" fill="#fbbf24"/>
  <rect x="286.0" y="58" width="57.0" height="11" fill="#60a5fa"/>
  <rect x="343.0" y="58" width="57.0" height="11" fill="#34d399"/>
</g>

  <g class="row" style="animation-delay:0.90s">
    <circle cx="26" cy="91" r="5" fill="#38bdf8"/>
    <text x="40" y="96" font-size="13" fill="#e2e8f0" font-weight="bold">Python</text>
    <text x="396" y="96" text-anchor="end" font-size="13" fill="#7dd3fc" font-weight="bold">45.0%</text>
    <rect x="40" y="104" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="104" width="120.6" height="9" rx="4.5" fill="#38bdf8" style="animation-delay:1.05s">
      <animate attributeName="width" from="0" to="120.6" dur="1.1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.25s">
    <circle cx="26" cy="133" r="5" fill="#fbbf24"/>
    <text x="40" y="138" font-size="13" fill="#e2e8f0" font-weight="bold">JavaScript</text>
    <text x="396" y="138" text-anchor="end" font-size="13" fill="#fde047" font-weight="bold">25.0%</text>
    <rect x="40" y="146" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="146" width="67.0" height="9" rx="4.5" fill="#fbbf24" style="animation-delay:1.40s">
      <animate attributeName="width" from="0" to="67.0" dur="1.1s" begin="1.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.60s">
    <circle cx="26" cy="175" r="5" fill="#60a5fa"/>
    <text x="40" y="180" font-size="13" fill="#e2e8f0" font-weight="bold">Java / PHP</text>
    <text x="396" y="180" text-anchor="end" font-size="13" fill="#93c5fd" font-weight="bold">15.0%</text>
    <rect x="40" y="188" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="188" width="40.2" height="9" rx="4.5" fill="#60a5fa" style="animation-delay:1.75s">
      <animate attributeName="width" from="0" to="40.2" dur="1.1s" begin="1.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.95s">
    <circle cx="26" cy="217" r="5" fill="#34d399"/>
    <text x="40" y="222" font-size="13" fill="#e2e8f0" font-weight="bold">HTML &amp; CSS</text>
    <text x="396" y="222" text-anchor="end" font-size="13" fill="#6ee7b7" font-weight="bold">15.0%</text>
    <rect x="40" y="230" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="230" width="40.2" height="9" rx="4.5" fill="#34d399" style="animation-delay:2.10s">
      <animate attributeName="width" from="0" to="40.2" dur="1.1s" begin="2.10s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
